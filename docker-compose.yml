services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: whisper
      POSTGRES_PASSWORD: whisperpass
      POSTGRES_DB: whisperdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://whisper:whisperpass@db:5432/whisperdb
      WHISPER_MODEL_SIZE: small
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      WHISPER_DEFAULT_LANGUAGE: fa
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
